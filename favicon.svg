<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="QR contact card">
  <!--
    Full-bleed on purpose. The maskable and Apple icons are generated from this
    file with no padding, so the blue has to run to the edge for the platform
    mask to have something to cut into; the glyph sits inside the central 56%,
    well within the maskable safe zone.
  -->
  <rect width="512" height="512" fill="#1976d2"/>
  <g fill="none" stroke="#fff" stroke-width="16">
    <rect x="120" y="120" width="80" height="80" rx="20"/>
    <rect x="312" y="120" width="80" height="80" rx="20"/>
    <rect x="120" y="312" width="80" height="80" rx="20"/>
  </g>
  <g fill="#fff">
    <rect x="144" y="144" width="32" height="32" rx="8"/>
    <rect x="336" y="144" width="32" height="32" rx="8"/>
    <rect x="144" y="336" width="32" height="32" rx="8"/>
    <rect x="240" y="240" width="32" height="32" rx="8"/>
    <rect x="304" y="240" width="32" height="32" rx="8"/>
    <rect x="368" y="240" width="32" height="32" rx="8"/>
    <rect x="272" y="304" width="32" height="32" rx="8"/>
    <rect x="336" y="304" width="32" height="32" rx="8"/>
    <rect x="240" y="368" width="32" height="32" rx="8"/>
    <rect x="304" y="368" width="32" height="32" rx="8"/>
    <rect x="368" y="368" width="32" height="32" rx="8"/>
  </g>
</svg>
