name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# peaceiris/actions-gh-pages pushes a commit to gh-pages, so the job needs
# write access to repository contents.
permissions:
  contents: write

# A superseded deploy is never worth finishing.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Must precede setup-node: the cache step resolves the Yarn cache
      # directory by invoking yarn, and without corepack that would be the
      # runner's bundled Yarn 1 rather than the version pinned in
      # package.json.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Check formatting
        run: yarn format:check

      # Type errors should fail the deploy, so this runs as its own step
      # rather than hiding inside the build script.
      - name: Type check
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Adds .nojekyll, so GitHub serves the built assets untouched.
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'deploy: ${{ github.sha }}'
