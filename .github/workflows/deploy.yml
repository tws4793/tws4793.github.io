name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing is pushed to the repository: the build is uploaded as an artifact
# and handed to Pages directly. `id-token` lets deploy-pages prove to Pages
# that the artifact came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push still supersedes an older one, but a deploy already under way
# is left to finish: cancelling one midway can leave Pages half-published.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Must precede setup-node: the cache step resolves the Yarn cache
      # directory by invoking yarn, and without corepack that would be the
      # runner's bundled Yarn 1 rather than the version pinned in
      # package.json.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Check formatting
        run: yarn format:check

      # Type errors should fail the deploy, so this runs as its own step
      # rather than hiding inside the build script.
      - name: Type check
        run: yarn typecheck

      - name: Build
        run: yarn build

      # Artifact deploys skip Jekyll entirely, so no .nojekyll is needed.
      - name: Upload the build
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # Split from the build so that the job running `yarn install` — and with it
  # every dependency's code — never holds the right to deploy.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
